name: CI Pipeline

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and Test Microservices
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "21"
          cache: maven

      - name: Build and test Authentication Service
        working-directory: ./authentification_service
        run: |
          chmod +x mvnw
          ./mvnw -B clean verify

      - name: Build and test User Service
        working-directory: ./user_service
        run: |
          chmod +x mvnw
          ./mvnw -B clean verify

      - name: Build and test Order Service
        working-directory: ./order_service
        run: |
          chmod +x mvnw
          ./mvnw -B clean verify

  docker-build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Authentication Service image
        run: docker build -t auth-service:${{ github.sha }} ./authentification_service

      - name: Build User Service image
        run: docker build -t user-service:${{ github.sha }} ./user_service

      - name: Build Order Service image
        run: docker build -t order-service:${{ github.sha }} ./order_service

      - name: Save Docker images
        run: |
          docker save auth-service:${{ github.sha }} -o auth-service.tar
          docker save user-service:${{ github.sha }} -o user-service.tar
          docker save order-service:${{ github.sha }} -o order-service.tar

      - name: Upload Docker images as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: docker-images
          path: |
            auth-service.tar
            user-service.tar
            order-service.tar
          retention-days: 7
