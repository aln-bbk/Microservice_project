spring:
  application:
    name: order-service

  datasource:
    url: ${ORDER_DB_URL}
    username: ${ORDER_DB_USERNAME}
    password: ${ORDER_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
    enabled: true

server:
  port: ${ORDER_SERVICE_PORT:8082}

user-service:
  url: ${USER_SERVICE_URL:http://localhost:8080}

resilience4j:
  circuitbreaker:
    instances:
      userService:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3

app:
  jwt:
    issuer: ${JWT_ISSUER:https://auth.example.com}
    public-key-location: ${JWT_PUBLIC_KEY_LOCATION:classpath:keys/public.pem}
